<div class="max-w-xl mx-auto mt-10 p-6 bg-white shadow-md rounded-lg">
  
  <form (ngSubmit)="updateProfile()" [formGroup]="updateForm" class="space-y-4">
    <div class="flex items-center gap-4 mb-6">
      <label class="cursor-pointer inline-block relative group">
        <img [src]="user.picture || 'https://via.placeholder.com/80'" alt="User Avatar"
          class="w-20 h-20 rounded-full object-cover border-2 border-gray-300 group-hover:border-blue-500 transition" />
        <input type="file" formControlName="picture" name="picture" (change)="uploadImage($event)" class="hidden" />
        <span
          class="absolute bottom-0 right-0 bg-blue-600 text-white text-xs px-2 py-1 rounded-full opacity-0 group-hover:opacity-100 transition">
          Change
        </span>
      </label>
  
      <div>
        <h2 class="text-xl font-semibold">Welcome back, {{ user.username }}</h2>
        <p class="text-sm text-gray-500">Manage your profile details</p>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Username</label>
      <input type="text" [(ngModel)]="user.username" name="username" formControlName="username"
        class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring focus:ring-blue-300" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" [(ngModel)]="user.email" name="email" formControlName="email"
        class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring focus:ring-blue-300" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Fullname</label>
      <input type="text" [(ngModel)]="user.fullname" name="fullname" formControlName="fullname"
        class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring focus:ring-blue-300" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Password</label>
      <input type="password" name="password" formControlName="password"
        class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring focus:ring-blue-300" />
    </div>

    <div class="pt-4">
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">Save
        Changes</button>
    </div>
  </form>
</div>
