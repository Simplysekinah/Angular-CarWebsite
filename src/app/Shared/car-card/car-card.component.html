<div class="min-w-[29rem] rounded-lg shadow-lg bg-white p-5" (click)="selectCar()" >
    <ng-container *ngIf="car; else loading" >
        <div class="flex justify-between">
            <div>
                <h2 class="text-xl font-semibold mt-3">{{ car.name }}</h2>
                <p>{{car.type}}</p>
            </div>
            <div (click)="favourite($event)">
                <ng-icon name="bootstrapHeart" />
            </div>
        </div>
        <img [src]="car.image" alt="{{ car.name }}" class="w-full h-48 object-fit rounded-md">
        <div class="text-gray-600 text-sm mt-2 flex justify-between">
            <p><ng-icon name="bootstrapEvStationFill"/> {{ car.fuelCapacity }}</p>
            <p> {{ car.steering }}</p>
            <p><ng-icon name="bootstrapPeopleFill"/> {{ car.capacity }}</p>
        </div>
        <div class="flex justify-between items-center">
            <p>${{ car.price }} per day</p>
            <button class="mt-4 w-fit bg-orange-500 text-white py-3 px-4 rounded hover:bg-orange-600 transition">
                Rent Now
            </button>
        </div>
    </ng-container>

    <ng-template #loading>
        <div class="animate-pulse">
            <div class="w-full h-48 bg-gray-300 rounded-md"></div>
            <div class="mt-3 h-6 bg-gray-300 rounded"></div>
            <div class="mt-2 h-4 bg-gray-300 rounded"></div>
            <div class="mt-2 h-4 bg-gray-300 rounded"></div>
            <div class="mt-2 h-4 bg-gray-300 rounded"></div>
            <div class="mt-4 h-10 bg-gray-400 rounded"></div>
        </div>
    </ng-template>
</div>
